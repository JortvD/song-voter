# HTTP-only vhost for Playlist Voter.
#
# Install:
#   sudo cp deploy/nginx/vote.jortvd.nl.conf /etc/nginx/sites-available/vote.jortvd.nl
#   sudo ln -s /etc/nginx/sites-available/vote.jortvd.nl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vote.jortvd.nl
#
# Certbot will add the HTTPS server and the HTTP->HTTPS redirect. Docker
# Compose publishes the backend on 127.0.0.1:8765.

server {
    listen 80;
    listen [::]:80;
    server_name vote.jortvd.nl;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend caps requests at 60s; leave a little headroom.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
